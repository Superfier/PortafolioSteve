name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Cambia a 'master' si tu rama principal se llama así

# Permisos necesarios para el token de GitHub
permissions:
  contents: read
  pages: write
  id-token: write

# Permitir un solo despliegue concurrente
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

        # Si usas Node.js (descomenta las siguientes líneas)
      - name: Setup Node 
        uses: actions/setup-node@v4
        with: 
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist' # Cambia a la carpeta compilada, por ejemplo 'dist' o 'build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4